<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b111b" />
    <meta name="robots" content="noindex" />
    <!-- Defaults assume this page is served from the app origin. Override with
         <meta name="health-url"> / <meta name="home-url"> or ?health=&lang= -->
    <title>Almost You · fora do ar</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e1420'/%3E%3Ccircle cx='27' cy='34' r='14' fill='%23ff7a59'/%3E%3Ccircle cx='38' cy='30' r='13' fill='none' stroke='%235ee7c2' stroke-width='4'/%3E%3Ccircle cx='49' cy='17' r='3' fill='%23ffd166'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink-950: #080c14;
        --ink-900: #0b111b;
        --ink-800: #111a28;
        --paper: #f7f0e2;
        --muted: #9fb0c7;
        --coral: #ff6b5b;
        --mint: #5eead4;
        --sun: #ffd166;
        --line: rgba(255, 255, 255, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(16px, 4vw, 40px);
        overflow-x: hidden;
        background:
          radial-gradient(120% 90% at 50% 0%, #0d1522 0%, var(--ink-950) 60%, #06090f 100%);
        color: var(--paper);
        font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI",
          system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 3px 3px;
        opacity: 0.6;
      }

      .aurora {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        filter: blur(0.5px);
      }

      .aurora__blob {
        position: absolute;
        width: min(70vw, 620px);
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.42;
        will-change: transform;
      }

      .aurora__blob--coral {
        top: -18%;
        left: -8%;
        background: radial-gradient(circle at 50% 50%, rgba(255, 107, 91, 0.5), transparent 68%);
        animation: drift 26s ease-in-out infinite alternate;
      }

      .aurora__blob--mint {
        right: -12%;
        bottom: -22%;
        background: radial-gradient(circle at 50% 50%, rgba(94, 234, 212, 0.34), transparent 68%);
        animation: drift 32s ease-in-out infinite alternate-reverse;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(100%, 560px);
        padding: clamp(26px, 5vw, 46px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
        border-radius: 30px;
        border: 1px solid var(--line);
        background: linear-gradient(165deg, rgba(24, 36, 53, 0.82), rgba(9, 14, 23, 0.92));
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
        animation: rise 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }

      .mark {
        width: 64px;
        height: 64px;
        flex: 0 0 auto;
      }

      .wordmark {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .wordmark span {
        color: var(--coral);
        margin-inline-start: 0.16em;
      }

      h1 {
        margin: 4px 0 0;
        font-size: clamp(1.55rem, 3.4vw, 2.1rem);
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .body {
        margin: 0;
        max-width: 44ch;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(8, 12, 20, 0.6);
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--paper);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--sun);
        box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.5);
        animation: pulse 1.8s ease-out infinite;
      }

      .status[data-state="online"] .dot {
        background: var(--mint);
        animation: none;
      }

      .status[data-state="no-connection"] .dot {
        background: var(--coral);
        animation: none;
      }

      button {
        margin-top: 6px;
        min-height: 46px;
        padding: 12px 26px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--coral), #ff8a5b);
        color: #1a0f0c;
        font: inherit;
        font-weight: 700;
        font-size: 0.98rem;
        cursor: pointer;
        box-shadow: 0 14px 30px rgba(255, 107, 91, 0.28);
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 18px 34px rgba(255, 107, 91, 0.34);
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      button:focus-visible {
        outline: 2px solid var(--mint);
        outline-offset: 3px;
      }

      .meta {
        margin: 2px 0 0;
        min-height: 1.2em;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        color: rgba(159, 176, 199, 0.75);
      }

      .meta span + span::before {
        content: "·";
        margin: 0 8px;
        opacity: 0.6;
      }

      .meta span:empty {
        display: none;
      }

      .meta span:empty + span::before {
        content: none;
      }

      noscript {
        position: relative;
        z-index: 1;
        margin-top: 18px;
        max-width: 44ch;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.5;
      }

      @keyframes drift {
        from {
          transform: translate3d(-2%, -1%, 0) scale(1);
        }
        to {
          transform: translate3d(3%, 3%, 0) scale(1.08);
        }
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.55);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(255, 209, 102, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(255, 209, 102, 0);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 420px) {
        .card {
          border-radius: 24px;
        }

        .mark {
          width: 54px;
          height: 54px;
        }

        button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .aurora__blob,
        .dot,
        .card {
          animation: none !important;
        }

        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="aurora__blob aurora__blob--coral"></span>
      <span class="aurora__blob aurora__blob--mint"></span>
    </div>

    <main class="card">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="18" fill="#111a28" />
        <circle cx="27" cy="34" r="14" fill="#ff6b5b" />
        <circle cx="38" cy="30" r="13" fill="none" stroke="#5eead4" stroke-width="4" />
        <circle cx="49" cy="17" r="3" fill="#ffd166" />
      </svg>

      <p class="wordmark">Almost<span>You</span></p>
      <h1 id="title">Fora do ar por um instante</h1>
      <p class="body" id="body">
        O Almost You está reiniciando ou sem conexão. Esta página tenta de novo sozinha e
        recarrega assim que o servidor responder.
      </p>

      <div class="status" id="status-pill" data-state="waiting" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="status">Tentando reconectar…</span>
      </div>

      <button id="retry" type="button">Tentar agora</button>
      <p class="meta">
        <span id="attempts"></span>
        <span id="countdown"></span>
      </p>
    </main>

    <noscript>
      Ative o JavaScript para a página se atualizar sozinha, ou recarregue manualmente.
      / Enable JavaScript so the page can refresh itself, or reload it manually.
    </noscript>

    <script>
      const HEALTH_URL =
        new URLSearchParams(location.search).get('health') ||
        document.querySelector('meta[name="health-url"]')?.content ||
        new URL('/api/health', location.href).href;

      const HOME_URL = new URL(
        document.querySelector('meta[name="home-url"]')?.content || './',
        location.href,
      ).href;

      const RETRY_SECONDS = 6;
      const PROBE_TIMEOUT_MS = 4500;

      const COPY = {
        'pt-BR': {
          pageTitle: 'Almost You · fora do ar',
          title: 'Fora do ar por um instante',
          body:
            'O Almost You está reiniciando ou sem conexão. Esta página tenta de novo sozinha e recarrega assim que o servidor responder.',
          status: 'Tentando reconectar…',
          online: 'Conectado! Recarregando…',
          noConnection: 'Sem conexão à internet',
          retry: 'Tentar agora',
          countdown: 'Nova tentativa em {s}s',
          attempts: 'Tentativas: {n}',
        },
        'en-US': {
          pageTitle: 'Almost You · offline',
          title: 'Down for a moment',
          body:
            'Almost You is restarting or unreachable. This page keeps trying and reloads as soon as the server answers.',
          status: 'Reconnecting…',
          online: 'Connected! Reloading…',
          noConnection: 'No internet connection',
          retry: 'Retry now',
          countdown: 'Next try in {s}s',
          attempts: 'Attempts: {n}',
        },
        'es-ES': {
          pageTitle: 'Almost You · fuera de línea',
          title: 'Fuera de línea por un momento',
          body:
            'Almost You se está reiniciando o no responde. Esta página lo intenta de nuevo y se recarga en cuanto el servidor responda.',
          status: 'Reconectando…',
          online: '¡Conectado! Recargando…',
          noConnection: 'Sin conexión a internet',
          retry: 'Reintentar ahora',
          countdown: 'Nuevo intento en {s}s',
          attempts: 'Intentos: {n}',
        },
        fr: {
          pageTitle: 'Almost You · hors ligne',
          title: 'De retour dans un instant',
          body:
            "Almost You redémarre ou ne répond pas. Cette page réessaie toute seule et se recharge dès que le serveur répond.",
          status: 'Reconnexion…',
          online: 'Connecté ! Rechargement…',
          noConnection: 'Pas de connexion internet',
          retry: 'Réessayer',
          countdown: 'Nouvel essai dans {s}s',
          attempts: 'Tentatives : {n}',
        },
        de: {
          pageTitle: 'Almost You · offline',
          title: 'Gleich wieder da',
          body:
            'Almost You startet neu oder ist nicht erreichbar. Diese Seite versucht es weiter und lädt neu, sobald der Server antwortet.',
          status: 'Verbindung wird hergestellt…',
          online: 'Verbunden! Seite wird neu geladen…',
          noConnection: 'Keine Internetverbindung',
          retry: 'Jetzt erneut versuchen',
          countdown: 'Nächster Versuch in {s}s',
          attempts: 'Versuche: {n}',
        },
      };

      function pickLocale() {
        const forced = new URLSearchParams(location.search).get('lang');
        if (forced && COPY[forced]) return forced;
        const preferences =
          navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || ''];
        for (const preference of preferences) {
          const code = String(preference).toLowerCase();
          if (code.startsWith('pt')) return 'pt-BR';
          if (code.startsWith('es')) return 'es-ES';
          if (code.startsWith('fr')) return 'fr';
          if (code.startsWith('de')) return 'de';
          if (code.startsWith('en')) return 'en-US';
        }
        return 'en-US';
      }

      const locale = pickLocale();
      const t = COPY[locale];

      document.documentElement.lang = locale;
      document.title = t.pageTitle;
      document.getElementById('title').textContent = t.title;
      document.getElementById('body').textContent = t.body;

      const statusPill = document.getElementById('status-pill');
      const statusText = document.getElementById('status');
      const attemptsEl = document.getElementById('attempts');
      const countdownEl = document.getElementById('countdown');
      const retryButton = document.getElementById('retry');
      retryButton.textContent = t.retry;

      let attempts = 0;
      let remaining = RETRY_SECONDS;
      let busy = false;
      let done = false;

      function setStatus(state, text) {
        statusPill.dataset.state = state;
        statusText.textContent = text;
      }

      function renderCountdown() {
        countdownEl.textContent = t.countdown.replace('{s}', String(remaining));
      }

      async function probe() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), PROBE_TIMEOUT_MS);
        try {
          const response = await fetch(HEALTH_URL, {
            cache: 'no-store',
            signal: controller.signal,
            headers: { Accept: 'application/json' },
          });
          return response.ok;
        } catch {
          return false;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function check() {
        if (busy || done) return;

        if (!navigator.onLine) {
          remaining = RETRY_SECONDS;
          renderCountdown();
          setStatus('no-connection', t.noConnection);
          return;
        }

        busy = true;
        retryButton.disabled = true;
        countdownEl.textContent = '';
        setStatus('waiting', t.status);

        const reachable = await probe();

        busy = false;
        retryButton.disabled = false;

        if (reachable) {
          done = true;
          setStatus('online', t.online);
          countdownEl.textContent = '';
          setTimeout(() => location.replace(HOME_URL), 700);
          return;
        }

        attempts += 1;
        attemptsEl.textContent = t.attempts.replace('{n}', String(attempts));
        remaining = RETRY_SECONDS;
        renderCountdown();
      }

      function countdownTick() {
        if (done || busy) return;
        if (!navigator.onLine) {
          remaining = RETRY_SECONDS;
          renderCountdown();
          setStatus('no-connection', t.noConnection);
          return;
        }
        if (statusPill.dataset.state === 'no-connection') {
          setStatus('waiting', t.status);
        }
        if (remaining > 0) {
          remaining -= 1;
          renderCountdown();
          return;
        }
        void check();
      }

      retryButton.addEventListener('click', () => {
        if (busy || done) return;
        remaining = 0;
        void check();
      });

      window.addEventListener('online', () => {
        if (!done) void check();
      });

      window.addEventListener('offline', () => {
        if (done) return;
        remaining = RETRY_SECONDS;
        renderCountdown();
        setStatus('no-connection', t.noConnection);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !done && !busy) void check();
      });

      renderCountdown();
      setTimeout(() => void check(), 700);
      setInterval(countdownTick, 1000);
    </script>
  </body>
</html>
